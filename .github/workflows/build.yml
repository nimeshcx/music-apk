name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip install Cython==0.29.33 virtualenv buildozer

    - name: Create buildozer.spec
      run: |
        buildozer init
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy,yt-dlp,certifi/g' buildozer.spec
        sed -i 's/# android.permissions = INTERNET/android.permissions = INTERNET, WRITE_EXTERNAL_STORAGE, READ_EXTERNAL_STORAGE/g' buildozer.spec
        
    - name: Build APK
      run: yes | buildozer android debug
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MusicApp-APK
        path: bin/*.apk
